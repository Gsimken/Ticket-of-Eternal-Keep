name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive versions
        id: versions
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_file=build/libs/ticket-of-eternal-keep-$MOD_VERSION.jar" >> "$GITHUB_OUTPUT"
          echo "resource_pack_file=build/resource-packs/Ticket_of_Eternal_Keep_Resource_Pack_$MINECRAFT_VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "release_notes=build/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Build server-side resource pack
        if: hashFiles('docs/resource-pack-26.1/pack.mcmeta') != ''
        run: |
          mkdir -p build/resource-packs
          cd docs/resource-pack-26.1
          zip -r "../../${{ steps.versions.outputs.resource_pack_file }}" .

      - name: Prepare release notes
        run: |
          NOTES_FILE=".github/release-notes/${{ steps.versions.outputs.mod_version }}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" "${{ steps.versions.outputs.release_notes }}"
          else
            {
              echo "# Ticket of Eternal Keep ${{ steps.versions.outputs.mod_version }}"
              echo
              echo "Release build for ${{ github.ref_name }}."
            } > "${{ steps.versions.outputs.release_notes }}"
          fi
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -n 1 || true)
          {
            echo
            echo "## Commits Included"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..HEAD"
            else
              git log --pretty=format:'- %s (%h)'
            fi
            echo
          } >> "${{ steps.versions.outputs.release_notes }}"
          if [ -f "${{ steps.versions.outputs.resource_pack_file }}" ]; then
            {
              echo
              echo "## Server-Side Resource Pack"
              echo
              echo "This release includes \`$(basename '${{ steps.versions.outputs.resource_pack_file }}')\` as an optional resource pack."
              echo "Use it only when running the mod server-side and allowing vanilla clients to see the custom ticket texture."
              echo "Players with the mod installed client-side do not need this extra pack."
            } >> "${{ steps.versions.outputs.release_notes }}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.versions.outputs.release_notes }}
          overwrite_files: true
          files: |
            build/libs/*.jar
            ${{ steps.versions.outputs.resource_pack_file }}

      - name: Publish to CurseForge
        if: env.CURSEFORGE_ID != '' && env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: ${{ steps.versions.outputs.jar_file }}
          name: Ticket of Eternal Keep ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.versions.outputs.release_notes }}
          loaders: fabric
          game-versions: ${{ steps.versions.outputs.minecraft_version }}
          java: 25
          dependencies: |
            fabric-api(required)

      - name: Publish to Modrinth
        if: env.MODRINTH_ID != '' && env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: ${{ steps.versions.outputs.jar_file }}
          name: Ticket of Eternal Keep ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.versions.outputs.release_notes }}
          loaders: fabric
          game-versions: ${{ steps.versions.outputs.minecraft_version }}
          java: 25
          dependencies: |
            fabric-api(required)
