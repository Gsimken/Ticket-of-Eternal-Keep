name: publish-curseforge

on:
  workflow_dispatch:
  schedule:
    # Check hourly so the first retry occurs roughly one hour after release.
    # Later attempts are gated to three-hour intervals.
    - cron: '29 * * * *'

permissions:
  contents: read

concurrency:
  group: publish-curseforge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_SLUG: ticket-of-eternal-keep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive versions
        id: versions
        shell: bash
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_file=build/libs/ticket-of-eternal-keep-$MOD_VERSION.jar" >> "$GITHUB_OUTPUT"
          echo "jar_name=ticket-of-eternal-keep-$MOD_VERSION.jar" >> "$GITHUB_OUTPUT"
          echo "release_notes=build/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Validate CurseForge project configuration
        shell: bash
        run: |
          if [ -z "$CURSEFORGE_ID" ]; then
            echo "::error::Repository variable CURSEFORGE_ID is not configured."
            exit 1
          fi

      - name: Check whether the version already exists
        id: existing_version
        shell: bash
        env:
          JAR_NAME: ${{ steps.versions.outputs.jar_name }}
          MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
        run: |
          PROJECT=$(curl --fail --silent --show-error --retry 3 \
            --header 'User-Agent: Gsimken/Ticket-of-Eternal-Keep (GitHub Actions)' \
            "https://api.cfwidget.com/minecraft/mc-mods/$CURSEFORGE_SLUG")

          if jq -e --arg jar "$JAR_NAME" --arg version "$MOD_VERSION" \
            'any(.files[]?; .name == $jar or .display == ("Ticket of Eternal Keep " + $version))' \
            <<< "$PROJECT" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "CurseForge already contains version $MOD_VERSION; publication is not needed."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $MOD_VERSION is not on CurseForge yet; continuing with publication."
          fi

      - name: Determine whether a retry is due
        id: retry_window
        shell: bash
        env:
          MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
          VERSION_EXISTS: ${{ steps.existing_version.outputs.exists }}
        run: |
          if [ "$VERSION_EXISTS" = 'true' ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No retry is needed because the version already exists."
            exit 0
          fi

          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Manual publication is eligible immediately."
            exit 0
          fi

          RELEASE_DATA=$(curl --fail --silent --show-error --retry 3 \
            --header 'User-Agent: Gsimken/Ticket-of-Eternal-Keep (GitHub Actions)' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$MOD_VERSION")
          PUBLISHED_AT=$(jq -r '.published_at // empty' <<< "$RELEASE_DATA")

          if [ -z "$PUBLISHED_AT" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub release exists for $MOD_VERSION; automatic retry is disabled for this version."
            exit 0
          fi

          RELEASE_EPOCH=$(date -d "$PUBLISHED_AT" +%s)
          NOW_EPOCH=$(date +%s)
          ELAPSED_SECONDS=$((NOW_EPOCH - RELEASE_EPOCH))

          if [ "$ELAPSED_SECONDS" -lt 3600 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "The first retry window opens one hour after the GitHub release."
            exit 0
          fi

          ELAPSED_HOURS=$(((ELAPSED_SECONDS - 3600) / 3600))
          if [ $((ELAPSED_HOURS % 3)) -eq 0 ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "The scheduled retry window is open."
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "The next three-hour retry window has not opened yet."
          fi

      - name: Validate CurseForge publishing token
        if: steps.retry_window.outputs.eligible == 'true'
        shell: bash
        run: |
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::Repository secret CURSEFORGE_TOKEN is not configured."
            exit 1
          fi

      - name: Validate Gradle wrapper
        if: steps.retry_window.outputs.eligible == 'true'
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 25
        if: steps.retry_window.outputs.eligible == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        if: steps.retry_window.outputs.eligible == 'true'
        run: chmod +x ./gradlew

      - name: Build
        if: steps.retry_window.outputs.eligible == 'true'
        run: ./gradlew build --no-daemon

      - name: Prepare release notes
        if: steps.retry_window.outputs.eligible == 'true'
        shell: bash
        env:
          MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
          RELEASE_NOTES: ${{ steps.versions.outputs.release_notes }}
        run: |
          NOTES_FILE=".github/release-notes/$MOD_VERSION.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" "$RELEASE_NOTES"
          else
            mkdir -p "$(dirname "$RELEASE_NOTES")"
            {
              echo "# Ticket of Eternal Keep $MOD_VERSION"
              echo
              echo "Compatibility update for Minecraft ${{ steps.versions.outputs.minecraft_version }}."
            } > "$RELEASE_NOTES"
          fi

      - name: Publish to CurseForge
        if: steps.retry_window.outputs.eligible == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: ${{ steps.versions.outputs.jar_file }}
          name: Ticket of Eternal Keep ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.versions.outputs.release_notes }}
          loaders: fabric
          game-versions: ${{ steps.versions.outputs.minecraft_version }}
          java: 25
          dependencies: |
            fabric-api(required)

      - name: Publication summary
        if: always()
        shell: bash
        env:
          MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
          VERSION_EXISTS: ${{ steps.existing_version.outputs.exists }}
        run: |
          echo "### CurseForge $MOD_VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [ "$VERSION_EXISTS" = 'true' ]; then
            echo "Version already exists; nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.retry_window.outputs.eligible }}" != 'true' ]; then
            echo "No publication is due in this retry window." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publication was attempted. Failed attempts will be retried by the three-hour schedule unless the version appears on CurseForge first." >> "$GITHUB_STEP_SUMMARY"
          fi
